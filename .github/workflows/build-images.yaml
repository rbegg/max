name: Build and Push Max Services

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: max-stt
            context: ./services/max-stt
            target: prod
            log_level: info
            platforms: linux/amd64,linux/arm64
          - service: max-assistant
            context: ./services/max-assistant
            target: prod
            platforms: linux/amd64
          - service: max-tts
            context: ./services/max-tts
            target: prod
            platforms: linux/amd64
          - service: ollama
            context: ./services/ollama
            OLLAMA_DEBUG: 0
            platforms: linux/amd64
          - service: proxy
            context: ./proxy
            target: prod
            platforms: linux/amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: ${{ matrix.platforms }}
          build-args: |
            # Platform-specific configurations for max-stt dual builds
            BASE_IMAGE:linux/amd64=nvidia/cuda:12.4.1-cudnn-runtime-ubuntu22.04
            GPU:linux/amd64=1
            BASE_IMAGE:linux/arm64=python:3.11-slim-bookworm
            GPU:linux/arm64=0
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          file: ${{ matrix.context }}/Dockerfile